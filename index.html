<!DOCTYPE html>

<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f1e9">
  <title>Our Classroom Memories</title>
  <style>
    :root { --ink:#25251f; --muted:#77766d; --paper:#f5f1e9; --card:#fffdf8; --accent:#b8523c; --line:#e8e1d6; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
    .cover { min-height:clamp(320px,58vh,620px); position:relative; display:grid; place-items:center; text-align:center; padding:36px 22px; color:white; background:linear-gradient(0deg,rgba(24,23,20,.62),rgba(24,23,20,.13)),url('images/cover.jpg') center 48%/cover,linear-gradient(135deg,#6c7561,#c49b77); }
    .cover-copy { max-width:820px; position:relative; text-shadow:0 2px 20px rgba(0,0,0,.24); }
    .eyebrow { text-transform:uppercase; letter-spacing:.23em; font-size:.72rem; font-weight:700; }
    h1,h2 { font-family:Georgia,"Times New Roman",serif; font-weight:500; }
    h1 { font-size:clamp(3rem,9vw,6.7rem); line-height:.98; letter-spacing:-.055em; margin:17px 0; }
    .cover p { margin:0; font-size:clamp(1rem,2vw,1.2rem); color:rgba(255,255,255,.88); }
    main { width:min(1100px,calc(100% - 36px)); margin:0 auto; padding:62px 0 88px; }
    .section-head { display:flex; justify-content:space-between; align-items:end; gap:24px; margin-bottom:24px; }
    h2 { font-size:clamp(2rem,5vw,3rem); letter-spacing:-.035em; margin:0 0 8px; }
    .section-head p { margin:0; color:var(--muted); line-height:1.6; }
    .count { color:var(--muted); font-size:.85rem; white-space:nowrap; }
    .people { display:grid; grid-template-columns:repeat(auto-fill,minmax(185px,1fr)); gap:13px; }
    .person { width:100%; text-align:left; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:19px 18px; color:var(--ink); cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:12px; font:inherit; font-weight:600; transition:transform .18s,border-color .18s,box-shadow .18s; }
    .person:hover { transform:translateY(-2px); border-color:#d4b2a6; box-shadow:0 8px 25px rgba(42,32,25,.07); }
    .person:focus-visible,.close:focus-visible { outline:3px solid #b8523c; outline-offset:3px; }
    .arrow { color:var(--accent); font-size:1.2rem; }
    .note { margin:25px 0 0; color:var(--muted); font-size:.88rem; }
    footer { border-top:1px solid var(--line); text-align:center; padding:22px; color:var(--muted); font-size:.8rem; }
    dialog { width:min(900px,calc(100% - 28px)); max-height:88vh; border:1px solid rgba(255,255,255,.55); border-radius:20px; padding:0; color:var(--ink); background:var(--card); box-shadow:0 25px 90px rgba(0,0,0,.35); }
    dialog::backdrop { background:rgba(26,24,22,.72); backdrop-filter:blur(4px); }
    .dialog-head { position:sticky;top:0;z-index:1;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:20px 23px;background:var(--card);border-bottom:1px solid var(--line); }
    .dialog-head h2 { font-size:1.8rem;margin:0; }
    .close { border:1px solid var(--line);border-radius:50%;width:40px;height:40px;background:transparent;font-size:1.3rem;cursor:pointer;color:var(--ink); }
    .gallery { padding:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:13px; }
    .gallery figure { margin:0;overflow:hidden;border-radius:12px;background:#eee8df; }
    .gallery img { display:block;width:100%;height:260px;object-fit:cover; }
    .gallery figcaption { padding:10px 12px;color:var(--muted);font-size:.86rem; }
    .empty { grid-column:1/-1;text-align:center;padding:36px 20px;color:var(--muted);line-height:1.7; }
    @media(max-width:560px) { main { padding:42px 0 60px; }.section-head { align-items:start;flex-direction:column;gap:12px; }.people { grid-template-columns:1fr 1fr;gap:9px; }.person { padding:15px 13px;font-size:.92rem; }.gallery { grid-template-columns:1fr 1fr;padding:12px;gap:9px; }.gallery img { height:190px; } }
    @media(max-width:360px) { .people,.gallery { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header class="cover">
    <div class="cover-copy">
      <div class="eyebrow">The people who made it special</div>
      <h1>Our Classroom<br>Memories</h1>
      <p>A little place for the moments we’ll always remember.</p>
    </div>
  </header>
  <main>
    <div class="section-head">
      <div><h2>Meet our class</h2><p>Choose a name to see their memories.</p></div>
      <div class="count" id="count">3 classmates</div>
    </div>
    <section class="people" id="people" aria-label="Classmate names"><button class="person" type="button"><span>Friend One</span><span class="arrow" aria-hidden="true">↗</span></button><button class="person" type="button"><span>Friend Two</span><span class="arrow" aria-hidden="true">↗</span></button><button class="person" type="button"><span>Friend Three</span><span class="arrow" aria-hidden="true">↗</span></button></section>
    <p class="note">Made with friendship, laughter, and a lot of memories.</p>
  </main>
  <footer>OUR CLASS, OUR STORIES ✦</footer>
  <dialog id="gallery-dialog" aria-labelledby="gallery-title">
    <div class="dialog-head"><h2 id="gallery-title"></h2><button class="close" id="close-dialog" aria-label="Close photo gallery">×</button></div>
    <div class="gallery" id="gallery"></div>
  </dialog>
  <script>
    // Add each classmate below. Put their photos in the images folder and list each filename.
    // Example: { name: 'Aarav', photos: ['aarav-1.jpg', 'aarav-2.jpg'] }
    const classmates = [
      { name: 'Friend One', photos: ['friend-one-1.jpg', 'friend-one-2.jpg'] },
      { name: 'Friend Two', photos: ['friend-two-1.jpg'] },
      { name: 'Friend Three', photos: ['friend-three-1.jpg'] }
    ];

    const people = document.getElementById('people');
    const dialog = document.getElementById('gallery-dialog');
    const gallery = document.getElementById('gallery');
    document.getElementById('count').textContent = `${classmates.length} classmates`;

    classmates.forEach((person) => {
      const button = document.createElement('button');
      button.className = 'person';
      button.type = 'button';
      button.innerHTML = `<span>${escapeHtml(person.name)}</span><span class="arrow" aria-hidden="true">↗</span>`;
      button.addEventListener('click', () => showGallery(person));
      people.append(button);
    });

    function showGallery(person) {
      document.getElementById('gallery-title').textContent = person.name;
      gallery.replaceChildren();
      const validPhotos = person.photos || [];
      if (!validPhotos.length) {
        const message = document.createElement('p');
        message.className = 'empty';
        message.textContent = 'Photos for this person haven’t been added yet.';
        gallery.append(message);
      } else {
        validPhotos.forEach((filename, index) => {
          const figure = document.createElement('figure');
          const image = document.createElement('img');
          image.src = `images/${encodeURIComponent(filename)}`;
          image.alt = `${person.name}, memory ${index + 1}`;
          image.loading = 'lazy';
          image.onerror = () => { figure.remove(); };
          const caption = document.createElement('figcaption');
          caption.textContent = `Memory ${index + 1}`;
          figure.append(image, caption);
          gallery.append(figure);
        });
      }
      dialog.showModal();
    }
    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[char]);
    }
    document.getElementById('close-dialog').addEventListener('click', () => dialog.close());
    dialog.addEventListener('click', (event) => { if (event.target === dialog) dialog.close(); });
    document.addEventListener('keydown', (event) => { if (event.key === 'Escape' && dialog.open) dialog.close(); });
  </script>


</body></html>
